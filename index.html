<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ДЕНЬ РОЖДЕНИЯ НИКИ ВСЕМ БЫТЬ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass {
      background: rgba(20, 20, 28, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen relative font-sans selection:bg-rose-500 selection:text-white flex items-center justify-center p-4">

  <!-- Фиксированный чистый фон БЕЗ блюра на фоне -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div 
      class="w-full h-full bg-cover bg-left md:bg-center transition-all duration-500 scale-100"
      style="background-image: url('./bg.jpg');">
    </div>
    <!-- Легкое прозрачное затемнение без блюра, чтобы лицо именинника было четко видно -->
    <div class="absolute inset-0 bg-black/35 md:bg-black/25"></div>
  </div>

  <!-- Главная карточка опросника (строго по центру экрана) -->
  <main id="app-card" class="glass w-full max-w-lg rounded-3xl p-6 sm:p-8 shadow-2xl my-6 transition-all duration-300 relative z-10">
    
    <!-- Шапка -->
    <header class="text-center mb-6">
      <div class="inline-block px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 text-xs font-mono uppercase tracking-widest mb-2 border border-rose-500/30">
        коттеджный разъеб • 21-22 ноября 2026
      </div>
      <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-purple-300 to-amber-300">
        ЛУЧШИЙ ДЕНЬ РОЖДЕНИЯ В 2026 ГОДУ
      </h1>
      <p class="text-xs sm:text-sm text-zinc-400 mt-2 leading-relaxed">
        лучший день рождения ники гедеванишвили
      </p>
    </header>

    <!-- Форма -->
    <form id="rsvp-form" class="space-y-6">
      
      <!-- 01: Имя -->
      <div class="space-y-2">
        <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400">
          01 // а ты кто?
        </label>
        <input
          type="text"
          id="name"
          required
          placeholder="имя / ник в тг / как записан в контактах"
          class="w-full px-4 py-3 rounded-2xl bg-black/50 border border-zinc-700/60 focus:border-rose-400 focus:ring-1 focus:ring-rose-400 outline-none text-sm placeholder:text-zinc-500 transition"
        >
      </div>

      <!-- 02: Явка -->
      <div class="space-y-2">
        <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400">
          02 // ты же понимаешь что надо быть?
        </label>
        <div class="grid grid-cols-1 gap-2.5 text-sm">
          <label class="flex items-center p-3 rounded-2xl bg-black/50 border border-zinc-700/60 hover:border-zinc-500 cursor-pointer transition">
            <input type="radio" name="attendance" value="Буду железно" required class="accent-rose-500 w-4 h-4 mr-3">
            <span>я точно буду // и я прыгаю в бассейн</span>
          </label>
          <label class="flex items-center p-3 rounded-2xl bg-black/50 border border-zinc-700/60 hover:border-zinc-500 cursor-pointer transition">
            <input type="radio" name="attendance" value="Скорее да" class="accent-rose-500 w-4 h-4 mr-3">
            <span>🤙 6-7 из 10 что доеду.. ))</span>
          </label>
          <label class="flex items-center p-3 rounded-2xl bg-black/50 border border-zinc-700/60 hover:border-zinc-500 cursor-pointer transition">
            <input type="radio" name="attendance" value="Скорее нет" class="accent-rose-500 w-4 h-4 mr-3">
            <span>вряд ли буду, маловероятно</span>
          </label>
          <label class="flex items-center p-3 rounded-2xl bg-black/50 border border-zinc-700/60 hover:border-zinc-500 cursor-pointer transition">
            <input type="radio" name="attendance" value="Скип" class="accent-rose-500 w-4 h-4 mr-3">
            <span>не я минус. я не пойду на лучший и самый разъебный день рождения.</span>
          </label>
        </div>
      </div>

      <!-- 03: Выпивка -->
      <div class="space-y-2">
        <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400">
          03 // а вщ будешь пить?
        </label>
        <div class="grid grid-cols-1 gap-2.5 text-sm">
          <label class="flex items-center p-3 rounded-2xl bg-black/50 border border-zinc-700/60 hover:border-zinc-500 cursor-pointer transition">
            <input type="radio" name="drinking" value="В салат" required class="accent-rose-500 w-4 h-4 mr-3">
            <span>я буду пить ВСЁ и ВСЁ ВРЕМЯ</span>
          </label>
          <label class="flex items-center p-3 rounded-2xl bg-black/50 border border-zinc-700/60 hover:border-zinc-500 cursor-pointer transition">
            <input type="radio" name="drinking" value="Кураж" class="accent-rose-500 w-4 h-4 mr-3">
            <span>я нормально буду пить)</span>
          </label>
          <label class="flex items-center p-3 rounded-2xl bg-black/50 border border-zinc-700/60 hover:border-zinc-500 cursor-pointer transition">
            <input type="radio" name="drinking" value="Символически" class="accent-rose-500 w-4 h-4 mr-3">
            <span>ну так поскольку постольку попью без удовольствия...</span>
          </label>
          <label class="flex items-center p-3 rounded-2xl bg-black/50 border border-zinc-700/60 hover:border-zinc-500 cursor-pointer transition">
            <input type="radio" name="drinking" value="Трезвый" class="accent-rose-500 w-4 h-4 mr-3">
            <span>фулл трезвость / водитель / держу ситуацию под контролем</span>
          </label>
        </div>
      </div>

      <!-- 04: Конкретный алкоголь -->
      <div class="space-y-2">
        <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400">
          04 // ЧТО будешь пить?
        </label>
        <input
          type="text"
          id="alcohol"
          required
          placeholder="джин, сидр, виски с колой, настойки, по стойке смирно..."
          class="w-full px-4 py-3 rounded-2xl bg-black/50 border border-zinc-700/60 focus:border-rose-400 focus:ring-1 focus:ring-rose-400 outline-none text-sm placeholder:text-zinc-500 transition"
        >
      </div>

      <!-- Кнопка -->
      <button
        type="submit"
        id="submit-btn"
        class="w-full py-4 rounded-2xl bg-gradient-to-r from-rose-500 via-purple-600 to-amber-500 text-white font-bold tracking-wide shadow-lg hover:opacity-95 active:scale-[0.98] transition cursor-pointer"
      >
        Зафиксировать ответ ⚡️
      </button>
    </form>

    <!-- Финал -->
    <div id="success-box" class="hidden text-center py-10 space-y-4">
      <div class="text-6xl animate-bounce">🫡</div>
      <h2 class="text-2xl font-black text-rose-400">БАЗА ЗАПИСАНА</h2>
      <p class="text-sm text-zinc-300 max-w-xs mx-auto">
        твои ответы улетели в таблицу именинника. теперь мы всё о тебе знаем.
      </p>
    </div>

    <!-- Ссылка на админку -->
    <footer class="text-center pt-6">
      <a href="admin.html" class="text-[11px] text-zinc-500 hover:text-zinc-300 font-mono transition">
        [ вход в штаб аналитики ]
      </a>
    </footer>

  </main>

  <script>
    const SHEETDB_URL = "https://sheetdb.io/api/v1/ol51f92mkep3z";

    const form = document.getElementById('rsvp-form');
    const alcoInput = document.getElementById('alcohol');
    const submitBtn = document.getElementById('submit-btn');

    document.querySelectorAll('input[name="drinking"]').forEach(el => {
      el.addEventListener('change', (e) => {
        if (e.target.value === 'Трезвый') {
          alcoInput.value = 'Трезвый (сок / вода)';
        } else if (alcoInput.value === 'Трезвый (сок / вода)') {
          alcoInput.value = '';
        }
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = "Записываем в списки...";

      const payload = {
        data: [{
          "Имя / Никнейм": document.getElementById('name').value.trim(),
          "Придет ли (Явка)": document.querySelector('input[name="attendance"]:checked').value,
          "Настрой по выпивке": document.querySelector('input[name="drinking"]:checked').value,
          "Что будет пить": alcoInput.value.trim(),
          "Дата и время ответа": new Date().toLocaleString('ru-RU')
        }]
      };

      try {
        await fetch(SHEETDB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        form.classList.add('hidden');
        document.getElementById('success-box').classList.remove('hidden');
      } catch (err) {
        alert("Ошибка при сохранении! Проверь подключение.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Зафиксировать ответ ⚡️";
      }
    });
  </script>
</body>
</html>
